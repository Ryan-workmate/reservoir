{% extends "base.html" %}
{% block title %}发布活动 - 校园活动管理系统{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">发布活动</h1>
</div>

<div class="card">
    <form method="POST" action="{{ url_for('create_activity') }}">
        <div class="form-group">
            <label class="form-label" for="title">活动标题 *</label>
            <input type="text" id="title" name="title" class="form-input" placeholder="请输入活动标题" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="description">活动描述 *</label>
            <textarea id="description" name="description" class="form-textarea" placeholder="请详细描述活动内容、参与方式等" required></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="location">活动地点 *</label>
                <input type="text" id="location" name="location" class="form-input" placeholder="例如：图书馆报告厅" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="start_time">活动时间 *</label>
                <input type="datetime-local" id="start_time" name="start_time" class="form-input" required>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="max_participants">最大报名人数 *</label>
            <input type="number" id="max_participants" name="max_participants" class="form-input" placeholder="请输入正整数" min="1" required style="max-width:200px;">
        </div>

        <div style="display:flex;gap:12px;margin-top:24px;">
            <button type="submit" class="btn btn-primary">发布活动</button>
            <a href="{{ url_for('activity_list') }}" class="btn btn-outline">取消</a>
        </div>
    </form>
</div>
{% endblock %}
